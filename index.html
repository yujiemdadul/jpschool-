    <script>
      (function() {
        // Suppress harmless Vite HMR WebSocket connection logs in preview iframe per environment constraints
        try {
          var isViteMsg = function(item) {
            if (!item) return false;
            var str = typeof item === 'string' ? item : (item.message || item.stack || (typeof item.toString === 'function' ? item.toString() : ''));
            return str.indexOf('[vite]') !== -1 || str.indexOf('WebSocket') !== -1 || str.indexOf('failed to connect to websocket') !== -1;
          };

          var _origError = console.error;
          console.error = function() {
            for (var i = 0; i < arguments.length; i++) {
              if (isViteMsg(arguments[i])) {
                console.debug.apply(console, arguments);
                return;
              }
            }
            _origError.apply(console, arguments);
          };

          var _origWarn = console.warn;
          console.warn = function() {
            for (var i = 0; i < arguments.length; i++) {
              if (isViteMsg(arguments[i])) {
                console.debug.apply(console, arguments);
                return;
              }
            }
            _origWarn.apply(console, arguments);
          };

          window.addEventListener('error', function(e) {
            if (isViteMsg(e.message) || isViteMsg(e.error)) {
              e.preventDefault();
              e.stopPropagation();
            }
          }, true);

          window.addEventListener('unhandledrejection', function(e) {
            if (isViteMsg(e.reason)) {
              e.preventDefault();
              e.stopPropagation();
            }
          }, true);
        } catch (e) {}

        try {
          var saved = localStorage.getItem('chandu_theme_preference');
          var isDark = saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }

          var savedFontSize = localStorage.getItem('chandu_font_size_preference') || 'normal';
          if (savedFontSize === 'large') {
            document.documentElement.style.fontSize = '18px';
          } else if (savedFontSize === 'small') {
            document.documentElement.style.fontSize = '15px';
          } else {
            document.documentElement.style.fontSize = '16px';
          }
        } catch (e) {}
      })();
    </script>
